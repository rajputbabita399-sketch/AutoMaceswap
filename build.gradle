plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = '1.0.0'
group = 'net.wurstclient'

repositories {
    maven { url 'https://maven.wurstclient.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
}

// This tells the factory to ignore the 'unpick' tool that is crashing
loom {
}
